name: EngBot CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # Job 1: Build & test the Backend (Express server)
  backend-ci:
    name: Backend CI (Express Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: |
          cd server
          npm ci || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/engapp' }}

      - name: Build TypeScript Server
        run: |
          cd server
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/engapp' }}

  # Job 2: Build & check the Frontend (Next.js client)
  frontend-ci:
    name: Frontend CI (Next.js Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: |
          cd client
          npm ci || npm install --legacy-peer-deps

      - name: Build Next.js Application
        run: |
          cd client
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5000/api' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'fake-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'fake-domain' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'fake-id' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'fake-bucket' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || 'fake-sender' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || 'fake-app-id' }}

  # Job 3: Automated Deploy (Runs only after Backend/Frontend CI pass and branch is main/master)
  deploy:
    name: Deploy to Production
    needs: [backend-ci, frontend-ci]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Trigger Render backend deploy using deploy webhook if configured
      - name: Deploy Backend to Render
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "🚀 Triggering Render backend build & deploy..."
            curl -f -X POST "$RENDER_HOOK" || echo "⚠️ Render deploy webhook returned non-zero status, continuing..."
            echo "Backend deployment triggered."
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret is not configured. Skipping backend deploy."
          fi

      # Deploy Next.js to Vercel if token configured
      - name: Deploy Frontend to Vercel
        working-directory: ./client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "🚀 Deploying frontend to Vercel..."
            npx vercel --prod --yes --token="$VERCEL_TOKEN" || echo "⚠️ Vercel deployment command executed."
          else
            echo "ℹ️ VERCEL_TOKEN secret is not configured. Skipping Vercel deploy."
          fi
